<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SympDoc Chatbot</title>
    <link rel="stylesheet" href="Chatbot.css">
</head>
<body>

<div class="chat-container">
    <div class="chat-header">SympDoc Chatbot</div>
    <div class="chat-messages" id="chat-messages">
        <div class="message bot">
            <div class="message-content">Hello! How can I assist you with your health today?</div>
        </div>
    </div>
    <div class="chat-input">
        <input type="text" id="user-input" placeholder="Type symptoms (comma-separated)...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script src="Chatbot.js"></script>
</body>
</html>
